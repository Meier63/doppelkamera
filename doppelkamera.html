  const r = rahmen(liste[0], K.W), nah = 110 * K.pxProMm, klein = Math.max(6, minF / 8);
  const schwer = p => { let x = 0, y = 0; for (const i of p) { x += i % K.W; y += (i / K.W) | 0; } return [x / p.length, y / p.length]; };
  const erw = erwarteteRichtung(liste[0]), el = erw ? Math.hypot(erw[0], erw[1]) : 0, c0 = schwer(liste[0]);
  let px = liste[0];
  for (const t of liste.slice(1)) {
    if (t.length < klein) break;
    const q = rahmen(t, K.W);
    const dx = Math.max(0, q.x0 - r.x1, r.x0 - q.x1), dy = Math.max(0, q.y0 - r.y1, r.y0 - q.y1);
    if (Math.hypot(dx, dy) >= nah) continue;
    if (el && Math.hypot(dx, dy) > 3) {
      const c = schwer(t), d = [c[0] - c0[0], c[1] - c0[1]], dl = Math.hypot(d[0], d[1]) || 1;
      if (Math.abs(d[0] * erw[0] + d[1] * erw[1]) / (dl * el) < 0.82) continue;
    }
    px = px.concat(t);
  }
  return px;
}

// Sieht ein Bildpunkt aus wie Schatten? Die Scheibe ist dort nur dunkler geworden, die Farbe gleich geblieben
// (Creme → dunkles Creme, Rot → dunkles Rot). Die Stahlspitze oder ein Barrel haben dagegen eine eigene Farbe.
function schattenArtig(i, F, R) {
  const ry = R.y[i];
  if (ry < 35) return false;   // auf Schwarz sieht man keinen Schatten
  const q = F.y[i] / ry;
  return q > 0.3 && q < 0.92 && Math.abs(F.c[i] - q * R.c[i]) < 8 + 0.08 * Math.abs(R.c[i]);
}

function richtungVektor() {
  return { oben: [0, -1], unten: [0, 1], links: [-1, 0], rechts: [1, 0] }[kamEinst.richtung] || null;
}

// Spitze eines Dart-Bereichs schätzen: Längsachse bestimmen, dann das richtige Ende wählen.
// Reihenfolge: eingestellte Richtung der Flights → aus der Kameralage berechnete Richtung (erw, Bildpunkte im
// Ausschnitt) → schmales Ende (der Flight ist breit) → gelernte Richtung.
function spitzeSchaetzen(px, W, erw) {
  const n = px.length;
  let mx = 0, my = 0;
  for (const i of px) { mx += i % W; my += (i / W) | 0; }
  mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;
  for (const i of px) { const dx = i % W - mx, dy = ((i / W) | 0) - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  let ux = Math.cos(th), uy = Math.sin(th);
  const el = erw ? Math.hypot(erw[0], erw[1]) : 0, e = el ? [erw[0] / el, erw[1] / el] : null;
  if (e && !richtungVektor()) return spitzeAufLinie(px, W, mx, my, e);
  // weicht die Längsachse stark von der berechneten Dartrichtung ab (z. B. wegen des Schattens), die berechnete nehmen
  if (e && Math.abs(ux * e[0] + uy * e[1]) < 0.9) { ux = e[0]; uy = e[1]; }
  const S = new Float32Array(n), T = new Float32Array(n);
  let smin = Infinity, smax = -Infinity;
  px.forEach((i, k) => {
    const dx = i % W - mx, dy = ((i / W) | 0) - my;
    S[k] = dx * ux + dy * uy; T[k] = -dx * uy + dy * ux;
    if (S[k] < smin) smin = S[k];
    if (S[k] > smax) smax = S[k];
  });
  const L = smax - smin, rand = Math.max(3, L * 0.2);
  let nA = 0, nB = 0;
  for (let k = 0; k < n; k++) { if (S[k] < smin + rand) nA++; else if (S[k] > smax - rand) nB++; }
  const verh = (nA + 1) / (nB + 1);                        // < 1: Ende A (−Achse) ist schmaler
  const eindeutig = L > 12 && (verh < 0.67 || verh > 1.5);
  const fest = richtungVektor(), g = kamEinst.gelernt;
  let spitzeA;
  if (fest) spitzeA = ux * fest[0] + uy * fest[1] > 0;    // Flights zeigen nach +Achse → Spitze bei A
  else if (e) spitzeA = ux * e[0] + uy * e[1] > 0;
  else if (eindeutig || !g) spitzeA = verh < 1;
  else spitzeA = ux * g[0] + uy * g[1] > 0;
  let ss = 0, tt = 0, c = 0;
  for (let k = 0; k < n; k++) if (spitzeA ? S[k] <= smin + 2 : S[k] >= smax - 2) { ss += S[k]; tt += T[k]; c++; }
  ss = ss / c + (spitzeA ? 1 : -1);                         // die Unschärfe hat den Bereich etwas vergrößert
  tt /= c;
  const flug = spitzeA ? [ux, uy] : [-ux, -uy];
  if (!fest && !e && eindeutig && L > 25) {                 // Richtung lernen (für spätere, uneindeutige Darts)
    const a = g ? [g[0] * 0.8 + flug[0] * 0.2, g[1] * 0.8 + flug[1] * 0.2] : flug, l = Math.hypot(a[0], a[1]) || 1;
    kamEinst.gelernt = [a[0] / l, a[1] / l];
    kamSpeichern();
  }
  return { x: mx + ss * ux - tt * uy, y: my + ss * uy + tt * ux, laenge: L, sicher: eindeutig || !!fest || !!e, flug };
}

// Spitze mit bekannter Dartrichtung e (Bild, vom Einstich zum Flight; ein Dart steckt aber oft 10–20° schräg):
// Unter allen Richtungen bis ±37° um e die Linie suchen, auf der die meisten Bildpunkte liegen – sie führt durch
// Flight, Schaft und Barrel; der Schatten auf der Scheibe liegt daneben. Die Spitze ist ihr Ende entgegen e.
function spitzeAufLinie(px, W, mx, my, e) {
  const n = px.length, X = new Float32Array(n), Y = new Float32Array(n);
  px.forEach((i, k) => { X[k] = i % W - mx; Y[k] = ((i / W) | 0) - my; });
  const band = Math.max(3, 5 * K.pxProMm), halb = band / 2, w0 = Math.atan2(e[1], e[0]);
  let best = { anz: -1 };
  for (let dw = -0.65; dw <= 0.651; dw += 0.03) {
    const u = [Math.cos(w0 + dw), Math.sin(w0 + dw)], v = [-u[1], u[0]];
    const faecher = new Map();
    for (let k = 0; k < n; k++) { const f = Math.floor((X[k] * v[0] + Y[k] * v[1]) / halb); faecher.set(f, (faecher.get(f) || 0) + 1); }
    for (const [f, a] of faecher) {
      const anz = a + (faecher.get(f + 1) || 0);
      if (anz > best.anz) best = { anz, u, t0: (f + 1) * halb };
    }
  }
  const u = best.u, v = [-u[1], u[0]];
  let smin = Infinity, smax = -Infinity;
  const S = new Float32Array(n), T = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    S[k] = X[k] * u[0] + Y[k] * u[1]; T[k] = X[k] * v[0] + Y[k] * v[1] - best.t0;
    if (Math.abs(T[k]) < band) { smin = Math.min(smin, S[k]); smax = Math.max(smax, S[k]); }
  }
  let ss = 0, tt = 0, c = 0;
  for (let k = 0; k < n; k++) if (Math.abs(T[k]) < band && S[k] <= smin + 2) { ss += S[k]; tt += T[k]; c++; }
  if (!c) return { x: mx, y: my, laenge: 0, sicher: false, flug: e };
  ss = ss / c + 1;   // die Unschärfe hat den Bereich etwas vergrößert
  tt = tt / c + best.t0;
  return { x: mx + ss * u[0] + tt * v[0], y: my + ss * u[1] + tt * v[1], laenge: smax - smin, sicher: true, flug: u };
}

// Die dünne Stahlspitze liegt oft unter dem Schwellwert: vom schmalen Ende aus in Verlängerung der Längsachse
// weitergehen, solange sich das Bild dort noch schwach (ab 32 % des Schwellwerts) vom Referenzbild unterscheidet.
function spitzeVerfolgen(sp, F, R, thr) {
  const [fx, fy] = sp.flug, W = K.W, H = K.H, max = Math.max(4, 25 * K.pxProMm);
  let x = sp.x, y = sp.y, fehl = 0;
  for (let k = 1; k <= max; k++) {
    const px = sp.x - fx * k, py = sp.y - fy * k;
    let best = 0;
    for (let q = -1; q <= 1; q++) {
      const xx = Math.round(px - fy * q), yy = Math.round(py + fx * q);
      if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
      const i = yy * W + xx;
      if (schattenArtig(i, F, R)) continue;
      best = Math.max(best, Math.abs(F.y[i] - R.y[i]), Math.abs(F.c[i] - R.c[i]) / 1.3);
    }
    if (best > thr * 0.32) { x = px; y = py; fehl = 0; } else if (++fehl >= 3) break;
  }
  return { ...sp, x, y };
}

function groessePruefen() {
  const v = K.video, vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh || v.readyState < 2) return false;
  const a = ausschnitt(), sw = vw * a.w, sh = vh * a.h;
  const W = Math.round(Math.min(800, sw)), H = Math.round(W * sh / sw);   // ausgewertet wird nur der Ausschnitt, bis 800 px breit
  const key = [W, H, a.x, a.y, a.w].map(n => n.toFixed(4)).join();
  if (key !== K.key) {
    K.key = key; K.a = a;
    K.W = W; K.H = H; K.w = 160; K.h = Math.round(160 * sh / sw);
    K.cv = leinwand(W, H); K.cx = K.cv.getContext('2d', { willReadFrequently: true });
    K.cvk = leinwand(K.w, K.h); K.cxk = K.cvk.getContext('2d', { willReadFrequently: true });
    K.ref = K.refLeer = K.refKlein = K.vorher = null;
    K.dartBereiche = [];
    K.maske = null;
    K.warnung = kamEinst.punkte && kamEinst.seitenverh && Math.abs(kamEinst.seitenverh - vw / vh) > 0.02
      ? 'Das Kamerabild hat ein anderes Format als beim Einrichten – bitte die Scheibe neu einrichten.' : '';
  }
  if (!K.maske) maskenBerechnen();
  return true;
}

// Nur die Scheibe und ihre Umgebung auswerten (bis 300 mm vom Bull) – Bewegungen daneben stören nicht
function maskenBerechnen() {
  const mk = (W, H) => {
    const m = new Uint8Array(W * H);
    if (!geo) return m.fill(1);
    const vz = Math.sign(abb(geo.zuBrett, ...geo.mitte)[2]);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const [bx, by, w] = abb(geo.zuBrett, K.a.x + (x + 0.5) / W * K.a.w, K.a.y + (y + 0.5) / H * K.a.h);
      m[y * W + x] = Math.sign(w) === vz && Math.hypot(bx, by) < 300 ? 1 : 0;
    }
    return m;
  };
  K.maske = mk(K.W, K.H);
  K.maskeK = mk(K.w, K.h);
  K.maskeAnz = K.maskeK.reduce((a, b) => a + b, 0) || 1;
  if (geo) {
    const idx = kamEinst.punkte.map((p, i) => (p ? i : -1)).filter(i => i >= 0);
    K.pxProMm = Math.sqrt(viereckFlaeche(idx.map(i => [(kamEinst.punkte[i][0] - K.a.x) / K.a.w * K.W, (kamEinst.punkte[i][1] - K.a.y) / K.a.h * K.H]))
      / viereckFlaeche(idx.map(i => EICHPUNKTE[i].mm)));
  } else K.pxProMm = 1;
}

function referenzNehmen(F) {
  K.ref = F || bildLesen(true);
  K.refLeer = { y: K.ref.y.slice(), c: K.ref.c.slice() };
  K.refKlein = bildLesen(false);
  K.seitLeer = 0;
  K.dartBereiche = [];
  K.diffBild = null;
}

function protokoll(text) {
  const d = new Date();
  K.protokoll = [`${fmtZeit(d)}:${pad(d.getSeconds())}  ${text}`].concat(K.protokoll).slice(0, 15);
  const el = document.getElementById('kameraProtokoll');
  if (el) el.textContent = K.protokoll.join('\n');
}

// Anteil der Bildpunkte eines Bereichs, die in der Maske m gesetzt sind
function anteilIn(px, m) {
  let n = 0;
  for (const i of px) if (m[i]) n++;
  return px.length ? n / px.length : 0;
}

function erkennungZuruecksetzen() {
  K.ref = K.refLeer = K.refKlein = K.vorher = null;
  K.W = 0;
  K.key = '';
  K.stillSeit = performance.now();
  K.bewegt = false;
  K.grossMs = 0;
  K.seitLeer = 0;
  K.dartBereiche = [];
  K.diffBild = null;
}

// ---------- Kamera: Erkennung (läuft etwa 12-mal je Sekunde, Anzeige etwa 25-mal) ----------

function kameraTakt() {
  if (!K.aktiv) { K.schleife = false; return; }
  setTimeout(kameraTakt, 40);   // etwa 25 Bilder je Sekunde fürs Anzeigen; requestAnimationFrame pausiert in verdeckten Fenstern
  const jetzt = performance.now();
  try {
    if (jetzt - K.letzteAnalyse >= 80) { K.letzteAnalyse = jetzt; analysieren(jetzt); }
    bildZeichnen();
  } catch (e) { console.error(e); }
}

function analysieren(jetzt) {
  if (!groessePruefen()) { statusSetzen('Warte auf das Kamerabild …'); return; }
  const klein = bildLesen(false);
  if (K.vorher) {
    let n = 0, sum = 0, z = 0;
    const a = klein.y, b = K.vorher.y, m = K.maskeK;
    for (let i = 0; i < a.length; i += 3) if (m[i]) { sum += a[i] - b[i]; z++; }
    const off = z ? sum / z : 0;   // Belichtungsautomatik der Kamera ist keine Bewegung
    for (let i = 0; i < a.length; i++) if (m[i] && Math.abs(a[i] - b[i] - off) > 14) n++;
    if (n > Math.max(4, K.maskeAnz * 0.0015)) {
      if (jetzt - K.stillSeit > 250) K.bewegungAb = jetzt;   // neue Bewegung beginnt (z. B. Einschlag eines Darts)
      K.stillSeit = jetzt;
      K.bewegt = true;
      if (n > K.maskeAnz * 0.04) K.grossMs += jetzt - K.letzteZeit;   // viel Bewegung (Hand, Person)
    }
  }
  K.vorher = klein;
  K.letzteZeit = jetzt;
  if (jetzt - K.stillSeit < kamEinst.ruhe) { statusSetzen(K.grossMs > 300 ? 'Bewegung im Bild …' : 'Bewegung …'); return; }
  if (!K.ref) { referenzNehmen(); statusAktualisieren(); return; }
  if (!K.bewegt && jetzt - K.letztePruefung < 400) return;
  const gross = K.grossMs > 500;
  K.bewegt = false; K.grossMs = 0; K.letztePruefung = jetzt;

  // schneller Vorab-Vergleich im kleinen Bild
  const kl = unterschied(klein, K.refKlein, K.maskeK, schwelle());
  const minK = Math.max(3, minMm2() * (K.pxProMm * K.w / K.W) ** 2 * 0.5);
  if (!gross && kl.anz < minK) {
    mischen(K.refKlein, klein, 0.1);   // langsame Lichtänderungen übernehmen
    if (kl.anz < minK / 2 && K.ref) {
      const F = bildLesen(true);
      mischen(K.ref, F, 0.1);
      if (!K.seitLeer && !kameraWartetAufZiehen() && K.refLeer) mischen(K.refLeer, F, 0.1);   // Scheibe leer: auch das Leerbild nachführen
    }
    statusAktualisieren();
    return;
  }
  auswerten(gross, klein);
}

function auswerten(gross, klein) {
  const F = bildLesen(true), thr = schwelle(), s2 = K.pxProMm ** 2, refAlt = K.ref;
  const minF = Math.max(8, minMm2() * s2), maxF = 20000 * s2;
  const neueRef = () => { K.ref = F; K.refKlein = klein; };
  const warten = kameraWartetAufZiehen();
  const jetzt = Date.now();

  // Herausgezogen? Nur wenn die Spitzen der erkannten Darts wieder wie die leere Scheibe aussehen –
  // eine Hand vor der Scheibe, ein Lichtwechsel oder ein nachschwingender Dart zählt nicht.
  const uL = K.refLeer ? unterschied(F, K.refLeer, K.maske, thr) : null;   // Unterschied zur leeren Scheibe
  // Mitten im Durchgang zusätzlich nur nach deutlicher Bewegung (Hand im Bild) – Nachschwingen allein reicht nicht.
  if (uL && (warten || (gross && K.dartBereiche.length))) {
    const weg = K.dartBereiche.length
      ? K.dartBereiche.every(d => anteilIn(d.spitze, uL.m) < 0.3)   // nur die Spitze: Flight und Schaft bewegen sich beim Nachschwingen
      : uL.anz < minF;   // Darts nur von Hand eingegeben: ganze Scheibe mit dem Leerbild vergleichen
    if (weg) {
      protokoll(`Herausziehen erkannt (${K.dartBereiche.length} ${K.dartBereiche.length === 1 ? 'Dart' : 'Darts'} weg)`);
      referenzNehmen(F); K.refKlein = klein;
      kameraEreignis('gezogen');
      return;
    }
  }
  const u = unterschied(F, K.ref, K.maske, thr);
  diffBildSetzen(u.m);
  if ((gross || u.anz > 2 * maxF) && warten) {
    // Durchgang voll und viel Bewegung: als Herausziehen werten (es wird dabei nichts aufgefüllt, Zählung bleibt richtig)
    protokoll('Viel Bewegung nach 3 Darts – als Herausziehen gewertet');
    referenzNehmen(F); K.refKlein = klein;
    kameraEreignis('gezogen');
    return;
  }
  if (u.anz > 2 * maxF) {
    // Licht oder Kamera verändert, Darts stecken noch: nur neues Referenzbild, nichts zählen
    protokoll('Bild stark verändert – nichts gezählt');
    neueRef();
    return;
  }
  if (warten) { protokoll('Änderung nach 3 Darts – nichts gezählt (erst herausziehen)'); neueRef(); return; }
  // Nach einer Handbewegung (Darts nicht gezogen) trotzdem nach neuen Darts suchen: Ein Dart, der kurz vor der
  // Hand geworfen wurde, ist sonst verloren. Die Hand selbst ist jetzt weg (ausgewertet wird erst bei ruhigem Bild).
  let b = dartTeile(bereiche(u.m, K.W, K.H), minF);
  if (!b || b.length < minF) {
    if (gross) { protokoll('Bewegung im Bild (Hand/Person) – nichts gezählt'); neueRef(); return; }
    if (b && b.length > minF / 3) protokoll(`Kleine Veränderung (${Math.round(b.length / s2)} mm²) – kein Dart`);
    mischen(K.ref, F, 0.3); statusAktualisieren(); return;
  }
  if (gross) protokoll('Bewegung im Bild (Hand/Person) – prüfe auf neuen Dart');
  // Schatten des Darts auf der Scheibe weglassen – er kann im Bild wie eine Verlängerung der Spitze aussehen
  const ohneSchatten = b.filter(i => !schattenArtig(i, F, K.ref));
  if (ohneSchatten.length >= minF / 2) b = ohneSchatten;
  if (b.length > maxF) { protokoll('Große Veränderung – kein Dart gezählt'); neueRef(); return; }
  // Nachschwingen/Verdrehen eines steckenden Darts: Dort, wo vorher Flight oder Schaft war, ist wieder die leere Scheibe
  // zu sehen. Ein neuer Dart – auch dicht daneben – verdeckt nur zusätzlich etwas und legt nichts frei.
  // Freigelegt = sieht jetzt wieder aus wie die leere Scheibe. Liegt das Freigelegte an einem steckenden Dart, hat der
  // sich bewegt; sonst (z. B. Rest einer Hand im Vergleichsbild) zählen nur die wirklich neuen Bildpunkte.
  if (uL) {
    const neu = b.filter(i => uL.m[i]), frei = 1 - neu.length / b.length;
    if (frei > 0.35 && K.dartBereiche.length) {
      const umfeld = new Uint8Array(K.W * K.H);
      for (const d of K.dartBereiche) for (const i of d.px) umfeld[i] = 1;
      let u2 = umfeld;
      for (let k = 0; k < Math.max(3, Math.round(8 * K.pxProMm)); k++) u2 = verbreitern(u2, K.W, K.H);
      const freiPx = b.filter(i => !uL.m[i]);
      if (anteilIn(freiPx, u2) > 0.5) {
        // Nachschwingen – aber steckt daneben (außerhalb des Bereichs um die Darts) ein deutlich neuer Dart?
        const daneben = neu.filter(i => !u2[i]);
        if (daneben.length < 1.5 * minF) {
          protokoll(`Steckender Dart hat sich bewegt (Nachschwingen, ${Math.round(frei * 100)} % frei) – nicht gezählt`);
          neueRef();
          return;
        }
        protokoll('Steckender Dart hat sich bewegt, daneben ein neuer Dart');
        b = daneben;
      }
    }
    if (frei > 0.1 && b.length > neu.length) {
      if (neu.length < minF) { protokoll('Nur Freigelegtes, kein neuer Dart – nicht gezählt'); neueRef(); return; }
      b = neu;
    }
  }
  const sp = spitzeVerfolgen(spitzeSchaetzen(b, K.W, erwarteteRichtung(b)), F, K.ref, thr);
  const nx = K.a.x + (sp.x + 0.5) / K.W * K.a.w, ny = K.a.y + (sp.y + 0.5) / K.H * K.a.h;
  const erg = { nx, ny, sicher: sp.sicher, zeit: jetzt };
  if (geo) {
    const [bx, by] = zuScheibe(nx, ny);
    Object.assign(erg, { bx, by, feld: feldAusPunkt(bx, by) });
  }
  // Zwei Würfe kurz hintereinander sind unmöglich: Beginnt die Bewegung weniger als 0,8 s nach dem Einschlag des
  // letzten Darts, ist es derselbe Dart (Nachschwingen, Belichtung der Kamera …)
  const jetztP = performance.now(), vorige = K.dartBereiche[K.dartBereiche.length - 1];
  const einschlag = K.bewegungAb > (vorige ? vorige.erkannt : 0) ? K.bewegungAb : jetztP - kamEinst.ruhe;
  if (vorige && einschlag - vorige.einschlag < 800) {
    protokoll(`Zu kurz nach dem letzten Dart (${Math.round(einschlag - vorige.einschlag)} ms) – als derselbe Dart gewertet`);
    neueRef();
    return;
  }
  // Spitze weit außerhalb der Scheibe: kein Dart (z. B. Schatten, Hand am Rand)
  if (erg.feld && Math.hypot(erg.bx, erg.by) > 260) {
    protokoll('Veränderung außerhalb der Scheibe – nicht gezählt');
    neueRef();
    return;
  }
  neueRef();
  dartMelden(b, sp, erg, einschlag, jetztP, 'Dart erkannt');
  // Noch ein Dart im selben Bild? (zweiter Wurf, bevor das Bild nach dem ersten ruhig war)
  if (geo && uL) weitereDarts(u, uL, b, sp, F, refAlt, thr, minF, jetzt, einschlag, jetztP);
}

function dartMelden(px, sp, erg, einschlag, erkannt, text) {
  K.seitLeer++;
  // Bereich um die Spitze (15 mm) merken: Ist er wieder wie die leere Scheibe, ist der Dart gezogen
  const R = Math.max(4, 15 * K.pxProMm), spitze = px.filter(i => Math.hypot(i % K.W - sp.x, ((i / K.W) | 0) - sp.y) < R);
  K.dartBereiche.push({ px, spitze: spitze.length >= 4 ? spitze : px, zeit: erg.zeit, einschlag, erkannt });
  K.letzte = erg;
  protokoll(`${text}: ${erg.feld ? erg.feld.name : '(nicht eingerichtet)'}`);
  kameraEreignis('dart', erg);
}

// Weitere, deutlich getrennte Darts in derselben Änderung suchen. Streng, damit Schatten oder Reste nicht mitzählen:
// neu (nicht nur freigelegt), kein Schatten, groß, länglich, eigene Spitze mindestens 15 mm von der ersten entfernt.
function weitereDarts(u, uL, b, sp1, F, R, thr, minF, jetzt, einschlag, erkannt) {
  let weg = new Uint8Array(K.W * K.H);
  for (const i of b) weg[i] = 1;
  for (let k = 0; k < Math.max(3, Math.round(6 * K.pxProMm)); k++) weg = verbreitern(weg, K.W, K.H);
  const rest = new Uint8Array(K.W * K.H);
  for (let i = 0; i < rest.length; i++) if (u.m[i] && !weg[i] && uL.m[i] && !schattenArtig(i, F, R)) rest[i] = 1;
  let gefunden = 0;
  for (const t of bereiche(rest, K.W, K.H)) {
    if (t.length < 1.5 * minF || gefunden >= 2 || kameraWartetAufZiehen()) break;
    const e = erwarteteRichtung(t);
    if (!e) break;
    const sp = spitzeVerfolgen(spitzeSchaetzen(t, K.W, e), F, R, thr);
    if (sp.laenge < 30 * K.pxProMm || Math.hypot(sp.x - sp1.x, sp.y - sp1.y) < 15 * K.pxProMm) continue;
    const nx = K.a.x + (sp.x + 0.5) / K.W * K.a.w, ny = K.a.y + (sp.y + 0.5) / K.H * K.a.h, [bx, by] = zuScheibe(nx, ny);
    if (Math.hypot(bx, by) > 260) continue;
    gefunden++;
    dartMelden(t, sp, { nx, ny, sicher: sp.sicher, zeit: jetzt, bx, by, feld: feldAusPunkt(bx, by) }, einschlag, erkannt, 'Noch ein Dart im selben Bild');
  }
}

// Wohin zeigt ein Dart an dieser Stelle im Bild (Bildpunkte im Ausschnitt)? Aus der geschätzten Kameralage.
function erwarteteRichtung(px) {
  if (!geo || !geo.lage || kamEinst.richtung !== 'auto') return null;
  let mx = 0, my = 0;
  for (const i of px) { mx += i % K.W; my += (i / K.W) | 0; }
  mx /= px.length; my /= px.length;
  const [x, y] = zuScheibe(K.a.x + (mx + 0.5) / K.W * K.a.w, K.a.y + (my + 0.5) / K.H * K.a.h);
  const d = dartRichtung(x, y);
  return d ? [d[0] / K.a.w * K.W, d[1] / K.a.h * K.H] : null;
}

function diffBildSetzen(m) {
  if (!kamEinst.diff) { K.diffBild = null; return; }
  const c = leinwand(K.W, K.H), cx = c.getContext('2d'), img = cx.createImageData(K.W, K.H);
  for (let i = 0; i < m.length; i++) if (m[i]) { img.data[i * 4] = 255; img.data[i * 4 + 1] = 40; img.data[i * 4 + 3] = 170; }
  cx.putImageData(img, 0, 0);
  K.diffBild = c;
}

// ---------- Kamera: Verbindung zum Spiel ----------

const kameraImSpiel = () => !!(lauf && lauf.eingabe === 'kamera' && !lauf.fertig);
function kameraWartetAufZiehen() {
  if (kameraImSpiel()) return !!lauf.ziehen;
  return K.seitLeer >= 3;
}

// ---------- Kamera: Ton bei erkanntem Dart (wird im Browser erzeugt, keine Tondatei) ----------

const TOENE = {
  zweiton: 'Treffer hoch, Daneben tief',
  piep: 'Piep',
  doppelpiep: 'Doppel-Piep',
  klick: 'Klick',
  glocke: 'Glocke',
  dingdong: 'Ding-Dong',
  aus: 'Aus'
};
let audio = null;
function audioKontext() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  // iPad/iPhone (ab iOS 17): als Wiedergabe anmelden, sonst unterdrückt die Stummschaltung die Töne
  try { if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback'; } catch (e) { /* älteres iOS */ }
  if (!audio) audio = new AC();
  if (audio.state !== 'running') audio.resume().then(tonStatusZeigen, () => {});
  return audio;
}
// Safari spielt Töne erst, nachdem die Seite angetippt wurde – und zählt erst das Loslassen (touchend/click), nicht das Aufsetzen.
// Dabei einen unhörbaren Ton abspielen, damit iOS die Wiedergabe sicher freigibt.
function tonFreischalten() {
  if (kamEinst.ton === 'aus' || (audio && audio.state === 'running')) return;
  const ctx = audioKontext();
  if (!ctx) return;
  try {
    const q = ctx.createBufferSource();
    q.buffer = ctx.createBuffer(1, 1, 22050);
    q.connect(ctx.destination);
    q.start(0);
  } catch (e) { /* egal */ }
  setTimeout(tonStatusZeigen, 300);
}
['touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, tonFreischalten, true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && audio && audio.state !== 'running') audio.resume().catch(() => {}); });

function tonStatusText() {
  if (kamEinst.ton === 'aus') return 'Ton ist aus.';
  if (!(window.AudioContext || window.webkitAudioContext)) return '⚠ Dieser Browser kann keine Töne erzeugen.';
  if (!audio || audio.state !== 'running') return '⚠ Ton noch gesperrt – einmal auf „▶“ tippen.';
  return '✓ Ton bereit.';
}
function tonStatusZeigen() {
  const el = document.getElementById('tonStatus');
  if (el) { el.textContent = tonStatusText(); el.className = 'hinweis ' + (/^✓/.test(el.textContent) ? 'ok' : 'warnung'); }
}

// ein Ton: Frequenz (Hz), Beginn und Dauer (s), Wellenform, Lautstärke 0–1
function klang(ctx, f, ab, dauer, form, laut) {
  const t = ctx.currentTime + ab, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = form;
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, laut), t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g).connect(ctx.destination);
  o.start(t);
  o.stop(t + dauer + 0.02);
}

// treffer: true/false im Training, null beim Testen auf der Kamera-Seite
function tonSpielen(treffer, art = kamEinst.ton) {
  if (art === 'aus') return;
  const ctx = audioKontext();
  if (!ctx || ctx.state === 'closed') return;
  const v = Math.min(1, Math.max(0, kamEinst.lautst)) * 0.5;
  if (!v) return;
  switch (art) {
    case 'piep': klang(ctx, 880, 0, 0.12, 'sine', v); break;
    case 'doppelpiep': klang(ctx, 990, 0, 0.07, 'sine', v); klang(ctx, 990, 0.1, 0.07, 'sine', v); break;
    case 'klick': klang(ctx, 1800, 0, 0.03, 'square', v * 0.5); klang(ctx, 600, 0, 0.04, 'triangle', v * 0.6); break;
    case 'glocke': klang(ctx, 1320, 0, 0.6, 'sine', v); klang(ctx, 2640, 0, 0.3, 'sine', v * 0.35); klang(ctx, 3960, 0, 0.15, 'sine', v * 0.15); break;
    case 'dingdong': klang(ctx, 784, 0, 0.25, 'sine', v); klang(ctx, 622, 0.18, 0.35, 'sine', v); break;
    default:   // zweiton
      if (treffer === false) klang(ctx, 300, 0, 0.18, 'triangle', v);
      else { klang(ctx, 660, 0, 0.09, 'sine', v); klang(ctx, 990, 0.09, 0.14, 'sine', v); }
  }
}

// leiser „Weiter“-Ton, wenn die Darts gezogen sind
function tonGezogen() {
  if (kamEinst.ton === 'aus' || !kamEinst.tonZiehen) return;
  const ctx = audioKontext();
  if (!ctx) return;
  const v = Math.min(1, Math.max(0, kamEinst.lautst)) * 0.3;
  if (!v) return;
  klang(ctx, 523, 0, 0.07, 'sine', v);
  klang(ctx, 784, 0.08, 0.1, 'sine', v);
}

function kameraEreignis(art, erg) {
  const L = lauf;
  if (art === 'dart') {
    if (kameraImSpiel() && ansicht !== 'kamera') {
      if (L.pause || !erg.feld) { statusAktualisieren(); return; }
      const ziel = L.felder[L.idx], treffer = trifft(erg.feld, ziel);
      tonSpielen(treffer);
      dartEingabe(treffer, {
        q: 'k', f: erg.feld.name, x: Math.round(erg.bx * 10) / 10, y: Math.round(erg.by * 10) / 10,
        nx: erg.nx, ny: erg.ny, knapp: abstandZiel(erg.bx, erg.by, ziel) < kamEinst.knapp || !erg.sicher
      });
      return;
    }
    K.testPunkte = K.testPunkte.concat([erg]).slice(-3);
    if (ansicht === 'kamera') { tonSpielen(null); render(); }
    return;
  }
  // gezogen
  K.testPunkte = [];
  if (kameraImSpiel()) aufnahmeBeendet(kamEinst.auffuellen);
  else if (ansicht === 'kamera') { tonGezogen(); render(); }
}

// Darts gezogen: fehlende Darts ergänzen (falls gewünscht), nächste Aufnahme bzw. nächstes Feld
function aufnahmeBeendet(auffuellen) {
  const L = lauf;
  if (!L || L.fertig) return;
  const fehlen = L.pause ? 0 : (3 - L.darts.length % 3) % 3;
  if (fehlen && auffuellen) {
    protokoll(`${fehlen} nicht gesehene${fehlen === 1 ? 'r Dart' : ' Darts'} als Daneben gezählt`);
    for (let i = 0; i < fehlen; i++) dartEingabe(0, { q: 'a' });
    meldung(`${fehlen === 1 ? 'Ein Dart wurde' : fehlen + ' Darts wurden'} nicht gesehen – als Daneben gezählt. Falls falsch: Rückgängig.`);
  }
  if (!lauf || lauf.fertig) { render(); return; }
  lauf.ziehen = false;
  if (lauf.pause && kamEinst.autoWeiter) {
    // Feld fertig und Darts gezogen: gleich zum nächsten Feld
    lauf.idx++;
    lauf.pause = false;
    protokoll(`Weiter zu ${feldName(lauf.felder[lauf.idx])}`);
    meldung(`Weiter mit ${feldName(lauf.felder[lauf.idx])}.`);
  } else if (!lauf.pause) {
    protokoll(`Nächste Aufnahme: Durchgang ${Math.floor(lauf.darts.length / 3) + 1}`);
  }
  tonGezogen();
  laufSpeichern();
  render();
}

// „Darts gezogen“ von Hand (falls die Kamera das Herausziehen nicht bemerkt hat)
function scheibeLeer() {
  protokoll('„Darts sind gezogen“ / „Referenzbild neu“ getippt');
  K.ref = null;   // neues Referenzbild, sobald das Bild ruhig ist
  K.seitLeer = 0;
  K.testPunkte = [];
  if (kameraImSpiel() && ansicht !== 'kamera') { aufnahmeBeendet(false); return; }   // von Hand: nichts auffüllen
  if (lauf) { lauf.ziehen = false; laufSpeichern(); }
  render();
}

function statusSetzen(t) {
  if (t === K.status) return;
  K.status = t;
  const el = document.getElementById('kameraStatus');
  if (el) el.textContent = t;
}
function statusAktualisieren() {
  if (!K.aktiv) return statusSetzen(K.startet ? 'Kamera startet …' : 'Kamera aus');
  if (!K.ref) return statusSetzen('Warte auf ruhiges Bild …');
  if (!geo) return statusSetzen('Bereit – Scheibe noch nicht eingerichtet');
  if (kameraWartetAufZiehen()) return statusSetzen('Darts herausziehen …');
  if (kameraImSpiel() && lauf.pause) return statusSetzen('Pause');
  statusSetzen('Bereit – werfen');
}

// ---------- Kamera: starten, wählen, stoppen ----------

function kameraFehlerText(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') {
    return 'Der Zugriff auf die Kamera wurde nicht erlaubt. iPad: in Safari links in der Adressleiste auf „aA“ bzw. das Symbol tippen → ' +
      'Website-Einstellungen → Kamera → „Erlauben“ (oder Einstellungen → Apps → Safari → Kamera).';
  }
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Keine Kamera gefunden. Ist die USB-C-Kamera angeschlossen?';
  if (n === 'NotReadableError') return 'Die Kamera ist belegt (z. B. von einer anderen App) oder lässt sich nicht öffnen.';
  return 'Die Kamera ließ sich nicht starten' + (e && e.message ? ': ' + e.message : '.');
}

const kameraMoeglich = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

async function kameraListe() {
  try {
    const g = await navigator.mediaDevices.enumerateDevices();
    K.geraete = g.filter(d => d.kind === 'videoinput' && d.deviceId);
  } catch (e) { K.geraete = []; }
}

// merken = vom Benutzer gewählt (sonst: gemerkte Kamera versuchen, bei Bedarf Ersatz nehmen, Auswahl nicht überschreiben)
async function kameraStarten(id, merken) {
  if (!kameraMoeglich()) {
    K.fehler = /^https:$/.test(location.protocol) || location.hostname === 'localhost'
      ? 'Dieser Browser kann nicht auf eine Kamera zugreifen.'
      : 'Die Kamera ist nur über eine sichere Webadresse (https) erreichbar – am iPad also über die veröffentlichte Seite, nicht als Datei.';
    render();
    return false;
  }
  kameraStoppen();
  K.startet = true;
  K.fehler = '';
  render();
  const groesse = { width: { ideal: 1920 }, height: { ideal: 1080 } };   // hohe Auflösung: Zoom-Ausschnitt bleibt scharf
  let stream = null, fehler = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: id ? { deviceId: { exact: id }, ...groesse } : groesse });
  } catch (e) {
    fehler = e;
    if (id && !merken && e.name !== 'NotAllowedError') {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: groesse }); fehler = null; } catch (e2) { fehler = e2; }
    }
  }
  if (!stream) { K.startet = false; K.fehler = kameraFehlerText(fehler); render(); return false; }
  quelleSetzen(stream, 'kamera');
  if (kamEinst.hwZoom != null) await hwZoomSetzen(kamEinst.hwZoom);
  await kameraListe();
  const track = stream.getVideoTracks()[0];
  const einst2 = track && track.getSettings ? track.getSettings() : {};
  const label = track ? track.label : '';
  track.addEventListener('ended', () => {
    if (K.stream !== stream) return;
    kameraStoppen();
    K.fehler = 'Die Kamera wurde getrennt.';
    render();
  });
  if (merken) {
    kamEinst.geraet = einst2.deviceId || id || null;
    kamEinst.geraetName = label;
    kamSpeichern();
  } else if (kamEinst.geraetName && label !== kamEinst.geraetName) {
    // Gerätekennung hat sich geändert (z. B. Safari): gleiche Kamera am Namen wiederfinden
    const g = K.geraete.find(d => d.label === kamEinst.geraetName);
    if (g && g.deviceId !== einst2.deviceId) return kameraStarten(g.deviceId, true);
  }
  render();
  return true;
}

function quelleSetzen(q, art) {
  const v = videoElement();
  if (K.stream && K.stream !== q) K.stream.getTracks().forEach(t => t.stop());
  K.stream = q instanceof MediaStream ? q : null;
  if (K.stream) { v.removeAttribute('src'); v.loop = false; v.srcObject = q; }
  else { v.srcObject = null; v.loop = true; v.src = q; }
  K.quelle = art;
  K.aktiv = true;
  K.startet = false;
  K.fehler = '';
  erkennungZuruecksetzen();
  v.play().catch(() => {});
  if (!K.schleife) { K.schleife = true; setTimeout(kameraTakt, 40); }
}

function kameraStoppen() {
  if (K.stream) K.stream.getTracks().forEach(t => t.stop());
  K.stream = null;
  if (K.video) {
    K.video.pause();
    if (K.video.src && K.video.src.startsWith('blob:')) URL.revokeObjectURL(K.video.src);
    K.video.srcObject = null;
    K.video.removeAttribute('src');
  }
  K.aktiv = false;
  K.quelle = null;
  K.testPunkte = [];
  erkennungZuruecksetzen();
  statusSetzen('Kamera aus');
}

// Im Training mit Kamera: Kamera starten, falls sie noch nicht läuft
function kameraSicherstellen() {
  if (K.aktiv || K.startet || !kameraMoeglich()) return;
  kameraStarten(kamEinst.geraet, false);
}

// Kamera ausschalten, wenn sie nirgends gebraucht wird (spart Akku)
function kameraVerwalten() {
  const gebraucht = ansicht === 'kamera' || (lauf && lauf.eingabe === 'kamera');
  if (K.aktiv && K.quelle === 'kamera' && !gebraucht) kameraStoppen();
}

// ---------- Kamera: Bild und Overlay zeichnen ----------

function markeZeichnen(c, x, y, farbe, s) {
  c.beginPath();
  c.arc(x, y, 7 * s, 0, 2 * Math.PI);
  c.fillStyle = farbe;
  c.fill();
  c.lineWidth = 2 * s;
  c.strokeStyle = '#fff';
  c.stroke();
}

function bildZeichnen() {
  const cv = document.getElementById('kameraBild'), v = K.video;
  if (!cv || !v || !v.videoWidth) return;
  const s = window.devicePixelRatio || 1, bw = cv.clientWidth, bh = Math.round(bw * v.videoHeight / v.videoWidth);
  if (cv.style.height !== bh + 'px') cv.style.height = bh + 'px';
  const W = Math.round(bw * s), H = Math.round(bh * s);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const c = cv.getContext('2d'), a = ausschnitt(), vw = v.videoWidth, vh = v.videoHeight;
  const X = nx => (nx - a.x) / a.w * W, Y = ny => (ny - a.y) / a.h * H;   // ganzes Bild (0–1) → Ausschnitt in der Anzeige
  const bild = () => c.drawImage(v, a.x * vw, a.y * vh, a.w * vw, a.h * vh, 0, 0, W, H);
  const linie = (pts, zu) => {
    c.beginPath();
    pts.forEach(([x, y], i) => (i ? c.lineTo(X(x), Y(y)) : c.moveTo(X(x), Y(y))));
    if (zu) c.closePath();
  };
  const modus = cv.dataset.modus, einrichten = modus === 'einrichten';
  const ziel = kameraImSpiel() && geo && modus === 'lauf' ? zielUmriss(lauf.felder[lauf.idx]) : null;
  const marken = [];
  if (modus === 'lauf' && lauf) {
    const n = lauf.darts.length, ab = lauf.pause ? n : n - (n % 3 || (lauf.ziehen ? 3 : 0));
    for (let i = Math.max(0, ab); i < n; i++) {
      const x = lauf.info[i];
      if (x && x.nx != null) marken.push([x.nx, x.ny, lauf.darts[i] ? '#22a45d' : '#e04848']);
    }
  } else for (const p of K.testPunkte) marken.push([p.nx, p.ny, '#f2c230']);

  // Inhalt (auch in der Lupe, dort mit dünneren Linien: f = Vergrößerung)
  const inhalt = f => {
    if (ziel) { linie(ziel, true); c.fillStyle = 'rgba(242, 194, 48, .35)'; c.fill(); c.lineWidth = 2 * s / f; c.strokeStyle = '#f2c230'; c.stroke(); }
    if (geo && (kamEinst.netz || einrichten)) {
      c.lineWidth = 1.2 * s / f;
      c.strokeStyle = 'rgba(80, 230, 255, .8)';
      for (const l of geo.netz) { linie(l); c.stroke(); }
    }
    for (const [x, y, farbe] of marken) markeZeichnen(c, X(x), Y(y), farbe, s / f);
  };
  // Lupe: Ausschnitt um (nx, ny) vergrößert, in der Ecke gegenüber
  const lupe = (nx, ny, z, kreuz, anteil) => {
    const px = X(nx), py = Y(ny), gr = Math.min(W, H) * anteil;
    const lx = px < W / 2 ? W - gr - 8 * s : 8 * s, ly = py < H / 2 ? H - gr - 8 * s : 8 * s;
    c.save();
    c.beginPath(); c.rect(lx, ly, gr, gr); c.clip();
    c.setTransform(z, 0, 0, z, lx + gr / 2 - px * z, ly + gr / 2 - py * z);
    bild();
    inhalt(z);
    c.restore();
    c.lineWidth = 2 * s;
    c.strokeStyle = '#f2c230';
    c.strokeRect(lx, ly, gr, gr);
    if (kreuz) {
      c.beginPath();
      c.moveTo(lx + gr / 2 - 12 * s, ly + gr / 2); c.lineTo(lx + gr / 2 + 12 * s, ly + gr / 2);
      c.moveTo(lx + gr / 2, ly + gr / 2 - 12 * s); c.lineTo(lx + gr / 2, ly + gr / 2 + 12 * s);
      c.stroke();
    }
  };

  bild();
  if (K.diffBild && kamEinst.diff && K.a && K.a.x === a.x && K.a.y === a.y && K.a.w === a.w) c.drawImage(K.diffBild, 0, 0, W, H);
  inhalt(1);

  if (einrichten) {
    const P = K.eich >= 0 ? K.eichNeu : (kamEinst.punkte || []);
    P.forEach((p, i) => {
      if (!p) return;
      const x = X(p[0]), y = Y(p[1]), aktivP = K.justieren && i === K.gewaehlt;
      const ungenau = K.eich < 0 && geo && geo.guete.max > 3 && geo.guete.schlecht === i;
      c.lineWidth = 2 * s;
      c.strokeStyle = aktivP ? '#f2c230' : ungenau ? '#ff5a5a' : '#fff';
      c.beginPath(); c.arc(x, y, (aktivP ? 14 : 10) * s, 0, 2 * Math.PI); c.stroke();
      c.beginPath(); c.moveTo(x - 18 * s, y); c.lineTo(x + 18 * s, y); c.moveTo(x, y - 18 * s); c.lineTo(x, y + 18 * s); c.stroke();
      c.font = `${14 * s}px system-ui, sans-serif`;
      c.fillStyle = aktivP ? '#f2c230' : ungenau ? '#ff5a5a' : '#fff';
      c.fillText(EICHPUNKTE[i].name, x + 16 * s, y - 14 * s);
    });
    if (K.justieren && kamEinst.punkte && kamEinst.punkte[K.gewaehlt]) { const [px, py] = kamEinst.punkte[K.gewaehlt]; lupe(px, py, 3, true, 0.42); return; }
    if (K.eich >= 0) return;
  }
  // Trefferbild: der zuletzt erkannte Dart vergrößert
  const m = marken[marken.length - 1];
  if (m) lupe(m[0], m[1], 2.5, false, 0.5);
}

// ---------- Kamera: Einrichten (4 Punkte antippen, verschieben) ----------

function bildPunkt(e, cv) {
  const r = cv.getBoundingClientRect(), a = ausschnitt();
  const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), fy = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  return [a.x + fx * a.w, a.y + fy * a.h];   // Anteil am ganzen Kamerabild
}

function eichungFertig(punkte) {
  kamEinst.punkte = punkte;
  kamEinst.seitenverh = K.video && K.video.videoHeight ? K.video.videoWidth / K.video.videoHeight : null;
  kamEinst.gelernt = null;
  kamSpeichern();
  geoBerechnen();
  K.warnung = '';
  K.ref = null;
}

document.addEventListener('pointerdown', e => {
  const cv = e.target;
  if (cv.id !== 'kameraBild' || cv.dataset.modus !== 'einrichten' || !K.aktiv) return;
  const p = bildPunkt(e, cv);
  if (K.eich >= 0) {
    e.preventDefault();
    K.eichNeu[K.eich] = p;
    eichWeiter();
    return;
  }
  if (!K.justieren || !kamEinst.punkte) return;
  // nächsten Punkt greifen (innerhalb von 60 px) und relativ verschieben – der Finger verdeckt ihn nicht
  const r = cv.getBoundingClientRect(), a = ausschnitt();
  let best = -1, bd = 60;
  kamEinst.punkte.forEach((q, i) => { if (!q) return; const d = Math.hypot((q[0] - p[0]) / a.w * r.width, (q[1] - p[1]) / a.h * r.height); if (d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  e.preventDefault();
  K.gewaehlt = best;
  K.ziehen = { start: p, punkt: kamEinst.punkte[best].slice(), id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (x) { /* egal */ }
  render();
});
document.addEventListener('pointermove', e => {
  if (!K.ziehen || e.pointerId !== K.ziehen.id) return;
  const cv = document.getElementById('kameraBild');
  if (!cv) return;
  const p = bildPunkt(e, cv), z = K.ziehen;
  kamEinst.punkte[K.gewaehlt] = [Math.min(1, Math.max(0, z.punkt[0] + (p[0] - z.start[0]) * 0.5)), Math.min(1, Math.max(0, z.punkt[1] + (p[1] - z.start[1]) * 0.5))];
  geoBerechnen();
});
const ziehenEnde = e => {
  if (!K.ziehen || e.pointerId !== K.ziehen.id) return;
  K.ziehen = null;
  eichungFertig(kamEinst.punkte);
};
document.addEventListener('pointerup', ziehenEnde);
document.addEventListener('pointercancel', ziehenEnde);

// nächster Einrichtpunkt; nach dem letzten: ausrechnen (mindestens 4 Punkte nötig)
function eichWeiter() {
  K.eich++;
  if (K.eich < EICHPUNKTE.length) { render(); return; }
  K.eich = -1;
  const P = EICHPUNKTE.map((_, i) => K.eichNeu[i] || null);
  if (P.filter(Boolean).length < 4) { meldung('Mindestens 4 Punkte sind nötig – bitte neu einrichten.'); render(); return; }
  eichungFertig(P);
  if (!geo) { meldung('Die Punkte passen nicht zusammen – bitte neu einrichten.'); kamEinst.punkte = null; kamSpeichern(); }
  else {
    K.justieren = true;
    K.gewaehlt = geo.guete.max > 3 ? geo.guete.schlecht : P.findIndex(Boolean);
    meldung('Eingerichtet. Passt das Netz auf die Drähte? Sonst Punkte verschieben.');
  }
  render();
}

function eichSchieben(dx, dy) {
  if (!kamEinst.punkte || !kamEinst.punkte[K.gewaehlt] || !K.video || !K.video.videoWidth) return;
  const p = kamEinst.punkte[K.gewaehlt];
  kamEinst.punkte[K.gewaehlt] = [p[0] + dx / K.video.videoWidth, p[1] + dy / K.video.videoHeight];
  eichungFertig(kamEinst.punkte);
}

// Kleine Scheibe als Hilfe: welcher Punkt ist anzutippen
function brettSvg(aktiv) {
  const R = 100, k = R / BRETT.dopAussen;
  let h = `<svg viewBox="-128 -128 256 256" width="150" height="150" aria-hidden="true">
    <circle r="${R}" fill="#1d1d1d" stroke="#555"/><circle r="${R}" fill="none" stroke="#a33" stroke-width="${8 * k}" transform="scale(${(BRETT.dopAussen - 4) / BRETT.dopAussen})"/>`;
  for (let i = 0; i < 20; i++) {
    const a = (i * 18 - 9) * Math.PI / 180, b = i * 18 * Math.PI / 180;
    h += `<line x1="${(16 * k * Math.sin(a)).toFixed(1)}" y1="${(-16 * k * Math.cos(a)).toFixed(1)}" x2="${(R * Math.sin(a)).toFixed(1)}" y2="${(-R * Math.cos(a)).toFixed(1)}" stroke="#555" stroke-width="1"/>
      <text x="${(116 * Math.sin(b)).toFixed(1)}" y="${(-116 * Math.cos(b) + 5).toFixed(1)}" text-anchor="middle" font-size="14" fill="#9db0a6">${SEKTOREN[i]}</text>`;
  }
  EICHPUNKTE.forEach((p, i) => {
    const x = p.mm[0] * k, y = -p.mm[1] * k, an = i === aktiv;
    const fertig = i < aktiv && K.eichNeu[i];
    h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${an ? 9 : 5}" fill="${an ? '#f2c230' : fertig ? '#22a45d' : i < aktiv ? '#5d6f65' : '#9db0a6'}" stroke="#0f1412" stroke-width="2"/>`;
  });
  return h + '</svg>';
}

// ---------- Kamera: Ansicht ----------

function kameraBildHtml(modus) {
  if (!K.aktiv) {
    return `<div class="kamera-leer">${K.startet ? 'Kamera startet …' : `Kamera aus<br>
      <button class="btn primaer" data-a="kameraStart" style="margin-top:12px">Kamera starten</button>`}</div>`;
  }
  return `<canvas id="kameraBild" class="kamerabild ${modus === 'einrichten' ? 'einrichten' : ''}" data-modus="${modus}"></canvas>`;
}

      <p style="margin:6px 0 10px">Im Bild genau dorthin tippen, wo der <b>äußere Rand des Doppelrings</b> auf den Draht zwischen
        <b>${EICHPUNKTE[K.eich].name.replace(' | ', '</b> und <b>')}</b> trifft.</p>
      <div class="zeile">
        <button class="btn klein" data-a="eichUeberspringen">Nicht sichtbar – überspringen</button>
        <button class="btn klein" data-a="eichAbbrechen">Abbrechen</button>
      </div>
      <p class="hinweis">Je genauer und je mehr Punkte, desto genauer die Erkennung. Mindestens 4 Punkte sind nötig.</p></div></div>`;
  } else {
    h += `<div class="zeile abstand">
      <button class="btn ${kamEinst.punkte ? '' : 'primaer'}" data-a="eichStart" ${K.aktiv ? '' : 'disabled'}>${kamEinst.punkte ? 'Neu einrichten' : 'Einrichten: 8 Punkte antippen'}</button>
      ${kamEinst.punkte ? `<button class="btn ${K.justieren ? 'an' : ''}" data-a="justieren" ${K.aktiv ? '' : 'disabled'}>Feinjustieren</button>` : ''}

    </div>`;
    if (K.justieren && kamEinst.punkte) {
      h += `<div class="justier">
        <div class="segment">${EICHPUNKTE.map((p, i) => (kamEinst.punkte[i]
          ? `<button class="btn klein ${i === K.gewaehlt ? 'an' : ''}" data-a="eichWahl" data-i="${i}">${p.name}</button>` : '')).join('')}</div>
        <div class="pfeile">
          <span></span><button class="btn" data-a="eichSchieben" data-dx="0" data-dy="-1" aria-label="hoch">▲</button><span></span>
          <button class="btn" data-a="eichSchieben" data-dx="-1" data-dy="0" aria-label="links">◀</button>
          <button class="btn primaer" data-a="justieren">Fertig</button>
          <button class="btn" data-a="eichSchieben" data-dx="1" data-dy="0" aria-label="rechts">▶</button>
          <span></span><button class="btn" data-a="eichSchieben" data-dx="0" data-dy="1" aria-label="runter">▼</button><span></span>
        </div></div>
        <p class="hinweis">Das hellblaue Netz soll genau auf den Drähten liegen. Einen Punkt im Bild greifen und ziehen
          (bewegt sich halb so schnell wie der Finger) oder mit den Pfeilen in kleinen Schritten verschieben. Die Lupe zeigt den gewählten Punkt vergrößert.</p>`;
    } else if (!kamEinst.punkte) {
      h += `<p class="hinweis">Kamera so befestigen, dass sie sich nicht bewegt, dann einrichten. Wird die Kamera verschoben, muss neu eingerichtet werden.</p>`;
    }
  }
  h += `</section>`;

  // Erkennung testen
  const t = K.testPunkte[K.testPunkte.length - 1];
  h += `<section class="karte"><h2>3. Erkennung testen und einstellen</h2>
    <div class="kamera-status" id="kameraStatus">${esc(K.status || 'Kamera aus')}</div>
    <div class="ergebnis ${t ? '' : 'leer'}">${t
      ? `<div class="erg-text">${t.feld ? esc(t.feld.name) : '?'}</div>
         <div class="erg-info">${t.feld ? 'erkanntes Feld' : 'Veränderung erkannt – Scheibe noch nicht eingerichtet'}${t.sicher ? '' : ' · <span class="warnung">Spitze unsicher</span>'}</div>`
      : 'Einen Dart werfen – das erkannte Feld erscheint hier und im Bild (gelber Punkt).'}</div>
    <div class="zeile">
      <button class="btn" data-a="scheibeLeer" ${K.aktiv ? '' : 'disabled'}>Referenzbild neu (Scheibe leer)</button>
      <label><input type="checkbox" data-c="kamDiff" ${kamEinst.diff ? 'checked' : ''}> Unterschiede rot zeigen</label>

    <div class="zeile abstand"><label><input type="checkbox" data-c="kamAuffuellen" ${kamEinst.auffuellen ? 'checked' : ''}>

    ${protokollHtml()}
    <div class="regler">
      <span>Empfindlichkeit</span><input type="range" min="1" max="10" step="1" value="${kamEinst.empf}" data-c="kamEmpf" aria-label="Empfindlichkeit">
      <b id="wertEmpf">${kamEinst.empf}</b>
      <span>Ruhezeit</span><input type="range" min="300" max="800" step="50" value="${kamEinst.ruhe}" data-c="kamRuhe" aria-label="Ruhezeit">
      <b id="wertRuhe">${kamEinst.ruhe} ms</b>
    </div>
    <p class="hinweis" id="wertSchwelle">Schwellwert ${schwelle()} (Helligkeit 0–255), kleinster Dart ${minMm2()} mm².
      Höhere Empfindlichkeit erkennt dunkle Darts auf dunklen Feldern besser, reagiert aber auch eher auf Schatten und Rauschen.
      Ruhezeit: so lange muss das Bild nach dem Wurf still sein, bevor ausgewertet wird.</p>
    <div class="zeile abstand">
      <label>Flights zeigen im Bild <select data-c="kamRichtung">${Object.entries(RICHTUNGEN).map(([k, v]) =>
        `<option value="${k}" ${kamEinst.richtung === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>„Knapp“ unter <select data-c="kamKnapp">${[0, 1, 2, 3].map(n =>
        `<option value="${n}" ${kamEinst.knapp === n ? 'selected' : ''}>${n ? n + ' mm' : 'nie'}</option>`).join('')}</select></label>
    </div>
    <p class="hinweis">In welche Richtung die Darts im Kamerabild abstehen, berechnet das Programm aus der Einrichtung – so findet es
      die Spitze, auch wenn der Schatten des Darts im Bild wie eine Verlängerung aussieht. Nur wenn die Spitze trotzdem oft am falschen
      Ende liegt, hier die Richtung der Flights einstellen. Liegt ein Treffer näher als „knapp“ am Feldrand, wird um Prüfung gebeten.</p>
  </section>`;

  h += `<section class="karte"><h2>4. Ton bei erkanntem Dart</h2>
    <div class="zeile">
      <select data-c="kamTon" aria-label="Ton">${Object.entries(TOENE).map(([k, v]) =>

        ? '<button class="btn" data-a="tonProbe" data-w="1">▶ Treffer</button><button class="btn" data-a="tonProbe" data-w="0">▶ Daneben</button>'

    <div class="zeile"><label><input type="checkbox" data-c="kamTonZiehen" ${kamEinst.tonZiehen ? 'checked' : ''}>

    </div>
    <p class="hinweis">Kurzer Ton, sobald die Kamera einen Dart erkannt hat. Bei „Treffer hoch, Daneben tief“ hört man das Ergebnis,
      ohne aufs Tablet zu schauen. Safari erlaubt Töne erst, nachdem die Seite einmal angetippt wurde.
      Ist nichts zu hören: Lautstärke des iPads mit den Tasten erhöhen, Stummschaltung im Kontrollzentrum ausschalten
      und prüfen, ob der Ton über Bluetooth (z. B. Kopfhörer, Lautsprecher) ausgegeben wird.</p>
  </section>`;

  h += `<section class="karte"><h2>Tipps für Kamera und Licht</h2>
    <ul class="tipps">
      <li><b>Schräg von der Seite oder von unten</b>, nicht von vorn: Von vorn verdeckt der Flight die Spitze. Gut sind 30–60° zur Scheibe,
        z. B. unten oder seitlich am Rand des Scheibenschranks bzw. Lichtrings.</li>
      <li><b>Nah</b>, aber die ganze Scheibe im Bild – je größer das Doppel im Bild, desto genauer.</li>
      <li><b>Fest montieren.</b> Schon ein leicht verschobenes Kabel verstellt die Einrichtung.</li>
      <li><b>Gleichmäßiges Licht</b> (z. B. LED-Ring), keine Sonne oder flackerndes Licht. Schatten der Darts sind möglichst kurz.</li>
      <li>Beim Wurf nicht vor die Kamera treten. Nach drei Darts erkennt die Kamera das Herausziehen und beginnt neu.</li>
      <li>Darts, die die Scheibe verfehlen, sieht die Kamera nicht: Sie werden beim Herausziehen als „Daneben“ ergänzt – oder gleich von Hand eingeben.</li>
      <li>Eine Kamera sieht weniger als Systeme mit drei Kameras: Jedes Ergebnis ist ein <b>Vorschlag</b> und mit einem Tipp korrigierbar.</li>
    </ul>
  </section>`;
  return h;
}

function protokollHtml() {
  return `<details class="tabelle-auf" id="protokollAuf" ${K.protokollOffen ? 'open' : ''}><summary>Was hat die Kamera erkannt? (Protokoll)</summary>
    <pre id="kameraProtokoll" class="protokoll">${esc(K.protokoll.join('\n') || 'Noch nichts.')}</pre></details>`;
}

document.addEventListener('toggle', e => { if (e.target.id === 'protokollAuf') K.protokollOffen = e.target.open; }, true);

// Wie gut passen die Einrichtpunkte zusammen?
function guteHtml() {
  const g = geo.guete, z = v => v.toFixed(1).replace('.', ',');
  if (geo.punkte < 5) return `<p class="hinweis warnung" style="margin-top:0">Eingerichtet mit ${geo.punkte} Punkten – die Genauigkeit lässt sich so nicht prüfen.
    „Neu einrichten“ mit 8 Punkten gleicht Tippfehler und die Verzerrung der Kameralinse aus.</p>`;
  if (g.max > 3) return `<p class="hinweis warnung" style="margin-top:0">⚠ Punkt <b>${EICHPUNKTE[g.schlecht].name}</b> passt nicht gut zu den anderen
    (${z(g.max)} mm). Bitte mit „Feinjustieren“ genau auf die Drahtkreuzung schieben (im Bild rot).</p>`;
  return `<p class="hinweis ok" style="margin-top:0">✓ ${geo.punkte} Punkte, sie passen gut zusammen (im Mittel ${z(g.mittel)} mm, höchstens ${z(g.max)} mm).
    Die Verzerrung der Kameralinse wird ausgeglichen.</p>`;
}

      <b id="wertHwZoom">${String(Number(kamEinst.hwZoom ?? hw.wert).toFixed(1)).replace('.', ',')}×</b>` : ''}
    </div>`;
  if (!ausfuehrlich) return h;
  h += `<div class="zeile abstand">
      ${geo ? '<button class="btn klein" data-a="zoomScheibe">Auf die Scheibe zoomen</button>' : ''}
      ${kamEinst.zoom > 1 ? '<button class="btn klein" data-a="zoomAus">Ganzes Bild</button>' : ''}
    </div>
    <p class="hinweis"><b>Zoom</b> vergrößert den Ausschnitt um die Scheibe: Im Training ist die Scheibe größer zu sehen, und die Erkennung
      wertet dort mehr Bildpunkte aus. Die ganze Scheibe muss im Bild bleiben. Die Einrichtung bleibt gültig. Beim Einrichten und Feinjustieren
      wird das ganze Bild gezeigt.
      ${hw ? '<br><b>Kamera-Zoom</b> verstellt die Kamera selbst (schärfer als der Zoom oben). Danach muss die Scheibe <b>neu eingerichtet</b> werden.'
        : '<br>Diese Kamera bietet keinen eigenen Zoom an (oder der Browser gibt ihn nicht frei) – der Zoom oben arbeitet mit dem Kamerabild.'}</p>`;
  return h;
}

// Ergebnis des letzten Darts (im Training mit Kamera)
function letzterDart() {
  const L = lauf;
  if (!L || !jeDart(L.eingabe)) return null;
  if (!L.pause && !L.fertig && L.darts.length) {
    const i = L.darts.length - 1;
    return { treffer: L.darts[i], info: L.info[i] || { q: 'h' } };
  }
  if ((L.pause || L.fertig) && !L.abgebrochen && L.erledigt.length) {
    const rec = daten.trainings.find(t => t.id === L.erledigt[L.erledigt.length - 1]);
    if (rec && rec.darts) return { treffer: rec.darts[rec.darts.length - 1], info: L.letzteInfo || { q: 'h' }, rec };
  }
  return null;
}

function korrigieren() {
  const L = lauf, d = letzterDart();
  if (!d) return;
  const inf = d.info;
  if (d.rec) {
    const r = d.rec, i = r.darts.length - 1;
    r.darts[i] = r.darts[i] ? 0 : 1;
    r.treffer = inDurchgaenge(r.darts);
    r.gesamt = r.treffer.reduce((a, b) => a + b, 0);
    if (inf.q !== 'h') {
      inf.korr = !inf.korr;
      if (r.eingabe === 'kamera') r.korrigiert = Math.max(0, (r.korrigiert || 0) + (inf.korr ? 1 : -1));
    }
    L.letzteInfo = inf;
    datenGeaendert();
  } else {
    const i = L.darts.length - 1;
    L.darts[i] = L.darts[i] ? 0 : 1;
    if (inf.q !== 'h') inf.korr = !inf.korr;
    L.info[i] = inf;
  }
  vibrieren();
  laufSpeichern();
  render();
  meldung(`Geändert auf ${d.treffer ? 'Daneben' : 'Treffer'}.`);
}

function renderErgebnis() {
  const d = letzterDart();
  if (!d) return `<div class="ergebnis leer">${K.aktiv ? 'Warte auf den ersten Dart …' : 'Kamera aus – Eingabe von Hand möglich'}</div>`;
  const inf = d.info || { q: 'h' };
  const quelle = inf.q === 'k' ? `Kamera: <b>${esc(inf.f)}</b>` : inf.q === 'a' ? 'nicht gesehen – als Daneben gezählt' : 'von Hand eingegeben';
  return `<div class="ergebnis ${d.treffer ? 'treffer' : 'daneben'}">
    <div class="erg-text">${d.treffer ? 'Treffer' : 'Daneben'}</div>
    <div class="erg-info">${quelle}${inf.korr ? ' · korrigiert' : ''}${inf.knapp && !inf.korr ? ' · <span class="warnung">knapp – bitte prüfen</span>' : ''}</div>
    <button class="btn" data-a="korrigieren">Falsch? → ${d.treffer ? 'Daneben' : 'Treffer'}</button>
  </div>`;
}

function kameraPanel() {
  let h = kameraBildHtml('lauf');
  h += `<div class="kamera-status" id="kameraStatus">${esc(K.status || '')}</div>`;
  if (K.aktiv) h += `<div class="zeile mitte zoom-knoepfe">
      <button class="btn klein" data-a="zoomMinus" aria-label="kleiner">− Zoom</button>
      <b id="wertZoom">${zoomText()}</b>
      <button class="btn klein" data-a="zoomPlus" aria-label="größer">Zoom +</button>
      ${geo ? '<button class="btn klein" data-a="zoomScheibe">Auf die Scheibe</button>' : ''}
    </div>`;
  if (K.aktiv && !geo) h += `<p class="hinweis warnung" style="text-align:center">Scheibe nicht eingerichtet – unter „Kamera“ einrichten. Bis dahin von Hand eingeben.</p>`;
  if (K.fehler) h += `<p class="hinweis warnung" style="text-align:center">${esc(K.fehler)}</p>`;
  if (K.aktiv && lauf && lauf.ziehen) h += `<div class="zeile mitte"><button class="btn klein" data-a="scheibeLeer">Darts sind gezogen</button></div>`;
  if (K.aktiv) h += protokollHtml();
  return h;
}

// Für Tests (z. B. mit einem künstlichen Kamerabild): window.doppelKamera.quelle(stream), .einrichten(punkte)
window.doppelKamera = {
  quelle: (q) => { quelleSetzen(q, 'test'); render(); },
  einrichten: (punkte) => { eichungFertig(punkteAuf8(punkte)); render(); },
  zustand: () => ({ status: K.status, letzte: K.letzte, ref: !!K.ref, pxProMm: K.pxProMm, seitLeer: K.seitLeer, W: K.W, H: K.H }),
  feldAusPunkt
};

geoBerechnen();

// ---------- Bedienung ----------

function setDg(n) {
  if (!Number.isFinite(n)) n = 5;
  einst.durchgaenge = Math.max(1, Math.min(100, Math.round(n)));
  einstSpeichern();
  render();
}

const aktionen = {
  tab: el => { ansicht = el.dataset.v; render(); window.scrollTo(0, 0); },
  neuAbbrechen: () => { neuerSpielerOffen = false; render(); },
  feld: el => {
    const f = Number(el.dataset.f), i = einst.felder.indexOf(f);
    if (i >= 0) einst.felder.splice(i, 1); else einst.felder.push(f);
    einst.felder.sort((a, b) => a - b);
    einstSpeichern(); render();
  },
  felderAlle: () => { einst.felder = FELDER.slice(); einstSpeichern(); render(); },
  felderKeine: () => { einst.felder = []; einstSpeichern(); render(); },
  reihenfolge: el => { einst.reihenfolge = el.dataset.w; einstSpeichern(); render(); },
  dg: el => setDg(Number(el.dataset.w)),
  dgMinus: () => setDg(einst.durchgaenge - 1),
  dgPlus: () => setDg(einst.durchgaenge + 1),
  start: () => starten(),
  treffer: el => eingabe(Number(el.dataset.n)),
  dart: el => dartEingabe(Number(el.dataset.n)),
  feldGesamt: el => feldGesamt(Number(el.dataset.n)),
  feldGesamtFeld: () => feldGesamt(parseInt(document.getElementById('gesamtZahl').value, 10)),
  eingabeArt: el => {
    if (!einst.spieler) return;
    einst.eingabeJe = Object.assign({}, einst.eingabeJe, { [einst.spieler]: el.dataset.w });
    einstSpeichern();
    render();
  },
  rueck: () => rueckgaengig(),
  weiter: () => weiter(),
  beenden: () => trainingBeenden(),
  nochmal: () => starten({ spieler: lauf.spieler, felder: lauf.auswahl, durchgaenge: lauf.durchgaenge, reihenfolge: lauf.reihenfolge, eingabe: lauf.eingabe }),
  neu: () => { lauf = null; laufSpeichern(); render(); window.scrollTo(0, 0); },
  spielerNeu: () => spielerNeu(),
  umbenennen: el => umbenennen(el.dataset.id),
  spielerLoeschen: el => spielerLoeschen(el.dataset.id),
  spielerZurueck: el => spielerZurueck(el.dataset.id),
  statZeit: el => { statF.zeitraum = el.dataset.w; statF.alle = false; statSpeichern(); render(); },
  statGruppe: el => { statF.gruppe = el.dataset.w; statSpeichern(); render(); },
  statSort: el => { statF.sort = el.dataset.w; statSpeichern(); render(); },
  statAlle: () => { statF.alle = true; render(); },
  trLoeschen: async el => {
    const t = daten.trainings.find(x => x.id === el.dataset.id);
    if (!t) return;
    const s = summe([t]);
    const ok = await dialog(`Dieses Training löschen?\n\n${fmtDatum(new Date(t.datum))} · ${spielerName(t.spieler)} · ${feldName(t.feld)} · ${s.treffer}/${s.darts}`,
      [{ text: 'Abbrechen', wert: null }, { text: 'Löschen', wert: true, art: 'gefahr' }]);
    if (!ok) return;
    daten.trainings = daten.trainings.filter(x => x.id !== t.id);
    datenGeaendert();
    render();
  },
  ordnerWaehlen: () => ordnerWaehlen(),
  ordnerSpeichern: () => inOrdnerSchreiben(false),
  ordnerVergessen: () => ordnerVergessen(),
  zugriff: () => zugriffErlauben(),
  teilen: () => teilen(),
  herunterladen: () => herunterladen(),
  dateiLaden: () => dateiLaden(),
  korrigieren: () => korrigieren(),
  tonZiehenProbe: () => { tonFreischalten(); const a = kamEinst.tonZiehen; kamEinst.tonZiehen = true; tonGezogen(); kamEinst.tonZiehen = a; },
  tonProbe: el => { tonFreischalten(); tonSpielen(el.dataset.w === '1'); setTimeout(tonStatusZeigen, 300); },
  zoomPlus: () => zoomAendern(kamEinst.zoom + 0.25),
  zoomMinus: () => zoomAendern(kamEinst.zoom - 0.25),
  zoomScheibe: () => { zoomAufScheibe(); render(); },
  zoomAus: () => { zoomAendern(1); render(); },
  scheibeLeer: () => scheibeLeer(),
  kameraStart: () => kameraStarten(kamEinst.geraet, true),
  kameraStopp: () => { kameraStoppen(); K.justieren = false; K.eich = -1; render(); },
  kameraSuchen: async () => {
    if (!kameraMoeglich()) return;
    if (!K.aktiv) await kameraStarten(kamEinst.geraet, false);   // Namen gibt es erst nach der Erlaubnis
    await kameraListe();
    render();
    meldung(`${K.geraete.length} ${K.geraete.length === 1 ? 'Kamera' : 'Kameras'} gefunden.`);
  },
  testvideo: () => { const i = document.getElementById('videoInput'); i.value = ''; i.click(); },
  eichStart: () => { K.eich = 0; K.eichNeu = []; K.justieren = false; render(); },
  eichAbbrechen: () => { K.eich = -1; render(); },
  eichUeberspringen: () => { K.eichNeu[K.eich] = null; eichWeiter(); },
  justieren: () => { K.justieren = !K.justieren; render(); },
  eichWahl: el => { K.gewaehlt = Number(el.dataset.i); render(); },
  eichSchieben: el => eichSchieben(Number(el.dataset.dx), Number(el.dataset.dy))
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled || document.querySelector('.overlay')) return;
  const f = aktionen[el.dataset.a];
  if (f) f(el);
});

document.addEventListener('change', e => {
  const c = e.target.dataset.c;
  if (!c) return;
  if (c === 'dg') setDg(parseInt(e.target.value, 10));
  else if (c === 'spielerWahl') {
    if (e.target.value === '__neu') {
      neuerSpielerOffen = true;
      render();
      const inp = document.getElementById('neuName');
      if (inp) inp.focus();
    } else {
      einst.spieler = e.target.value;
      neuerSpielerOffen = false;
      einstSpeichern();
      render();
    }
  }
  else if (c === 'statSpieler') { statF.spieler = e.target.value; statF.alle = false; statSpeichern(); render(); }
  else if (c === 'statVon') { statF.von = e.target.value; statSpeichern(); render(); }
  else if (c === 'statBis') { statF.bis = e.target.value; statSpeichern(); render(); }
  else if (c === 'kameraWahl') { if (e.target.value) kameraStarten(e.target.value, true); }
  else if (c === 'kamNetz') { kamEinst.netz = e.target.checked; kamSpeichern(); }
  else if (c === 'kamDiff') { kamEinst.diff = e.target.checked; K.diffBild = null; kamSpeichern(); }
  else if (c === 'kamAuffuellen') { kamEinst.auffuellen = e.target.checked; kamSpeichern(); }
  else if (c === 'kamAutoWeiter') { kamEinst.autoWeiter = e.target.checked; kamSpeichern(); }
  else if (c === 'kamTonZiehen') { kamEinst.tonZiehen = e.target.checked; kamSpeichern(); }
  else if (c === 'kamTon') { kamEinst.ton = e.target.value; kamSpeichern(); tonSpielen(true); render(); }
  else if (c === 'kamRichtung') { kamEinst.richtung = e.target.value; kamSpeichern(); }
  else if (c === 'kamKnapp') { kamEinst.knapp = Number(e.target.value); kamSpeichern(); }
  else if (c === 'kamEmpf' || c === 'kamRuhe') render();
  else if (c === 'autoOrdner') {
    meta.autoOrdner = e.target.checked;
    lsSchreiben(LS.meta, meta);
    if (meta.autoOrdner && meta.ungesichert) inOrdnerSchreiben(false);
    else render();
  }
});

document.addEventListener('keydown', e => {
  if (document.querySelector('.overlay')) return;
  const ziel = e.target;
  if (ziel.matches && ziel.matches('input, select, textarea')) {
    if (e.key === 'Enter' && ziel.id === 'neuName') { e.preventDefault(); spielerNeu(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && ziel.closest && ziel.closest('button')) return; // Knopf löst selbst aus
  if (ansicht !== 'training' || !lauf || lauf.fertig || e.ctrlKey || e.metaKey || e.altKey) return;
  if (lauf.pause) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); weiter(); }
    else if ((e.key === 'k' || e.key === 'K') && lauf.eingabe === 'kamera') { e.preventDefault(); korrigieren(); }
    else if (e.key === 'Backspace') { e.preventDefault(); rueckgaengig(); }
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); rueckgaengig(); }
  else if (jeDart(lauf.eingabe)) {
    if (e.key === 'k' || e.key === 'K') { e.preventDefault(); korrigieren(); }
    else if (e.key === '1' || e.key === '+') { e.preventDefault(); dartEingabe(1); }
    else if (e.key === '0' || e.key === '-') { e.preventDefault(); dartEingabe(0); }
  }
  else if (lauf.eingabe === 'durchgang' && /^[0-3]$/.test(e.key)) { e.preventDefault(); eingabe(Number(e.key)); }
});

farbenZuweisen();
lsSchreiben(LS.daten, daten);
if (lauf && !lauf.fertig) wachHalten(true);
render();
if (lauf && lauf.eingabe === 'kamera' && !lauf.fertig) kameraSicherstellen();
ordnerInit();
</script>
